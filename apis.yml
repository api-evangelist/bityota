name: BitYota
description: BitYota was a Data-Warehouse-as-a-Service (DWaaS) startup founded around 2011 in
  Santa Clara, California, offering a SaaS analytics data warehouse that ran on top of Amazon Web
  Services and Rackspace infrastructure and natively queried semi-structured JSON data. The company's
  team of data-processing engineers was acqui-hired by LifeLock in August 2015 for approximately
  $12.8 million, and the standalone BitYota product and company were subsequently wound down. The
  primary domain bityota.com no longer resolves (no DNS records), no public API, developer portal,
  documentation, source repositories, or client SDKs survive, and there is no active API surface for
  the enrichment pipeline to harvest. This profile is retained for historical/network completeness
  and is flagged defunct.
